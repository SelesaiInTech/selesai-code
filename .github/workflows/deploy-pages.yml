name: Publish Selesai Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gh-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: doc-web/package-lock.json

      - name: Verify site
        run: npm ci && npm run verify
        working-directory: doc-web
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Publish gh-pages branch
        env:
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          publish_dir="$RUNNER_TEMP/gh-pages"
          if git ls-remote --exit-code --heads origin gh-pages; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git" "$publish_dir"
          else
            git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git" "$publish_dir"
            git -C "$publish_dir" checkout --orphan gh-pages
            git -C "$publish_dir" rm -rf .
          fi

          find "$publish_dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a doc-web/dist/. "$publish_dir/"
          touch "$publish_dir/.nojekyll"

          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add --all
          if ! git -C "$publish_dir" diff --cached --quiet; then
            git -C "$publish_dir" commit -m "docs: publish site"
            git -C "$publish_dir" push origin gh-pages
          fi
